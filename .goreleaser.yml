version: 2

project_name: rigwatch

before:
  hooks:
    - go mod tidy

builds:
  - id: rigwatch
    main: ./cmd/rigwatch
    binary: rigwatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/allisonhere/rigwatch/internal.Version={{ .Version }}'
      - -X 'github.com/allisonhere/rigwatch/internal.GitCommit={{ .Commit }}'
      - -X 'github.com/allisonhere/rigwatch/internal.BuildDate={{ .Date }}'
      - -X 'github.com/allisonhere/rigwatch/internal.GitTag={{ .Tag }}'

archives:
  - id: default
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats: [binary]

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: allisonhere
    name: rigwatch
  draft: false
  prerelease: auto
  name_template: "Release {{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
