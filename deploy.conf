# deploy.conf — what the shared Tide release console (deploy.sh) needs to know
# about this app. deploy.sh itself is identical in every Tide repository; see the
# comments in ../tide/deploy.conf for what each setting means.

APP_NAME="Rigwatch"
BINARY_NAME="rigwatch"
REPO="allisonhere/rigwatch"
AUR_PKGNAME="rigwatch-bin"
BINARIES=("rigwatch:./cmd/rigwatch")
CHECKSUMS_ASSET="checksums.txt"
GO_BUILD_FLAGS=(-trimpath)
# rigwatch keeps its version in the internal package, not main.
VERSION_VAR="github.com/allisonhere/rigwatch/internal.Version"
RELEASE_NOTES="generated"
APP_GLYPH="◈"
ACCENT_RGB="50;217;255"
ACCENT2_RGB="255;79;195"
