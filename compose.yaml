services:
  rigwatch:
    build:
      context: .
      # No build args — Dockerfile auto-derives GIT_TAG/GIT_COMMIT/BUILD_DATE
      # from the .git dir. Override with --build-arg if needed.
    container_name: rigwatch-web
    restart: unless-stopped
    # Must share host network + NET_ADMIN so `wg show pia` sees the host tunnel
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      # SSH config & keys for connecting to monitored hosts
      - ~/.ssh:/root/.ssh:ro
      # Known hosts file gets updated as hosts are connected to
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts
      # Rigwatch managed SSH config (for key installs, etc.)
      - ~/.ssh/rigwatch-config.d:/root/.ssh/rigwatch-config.d:ro
      # Host sysfs (read-only) so AMD/NVIDIA GPU detection sees the real GPU
      - /sys:/sys:ro
    environment:
      - TZ=America/Chicago
    # Health check: the API endpoint returns JSON
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/hosts"]
      interval: 30s
      timeout: 5s
      retries: 3
